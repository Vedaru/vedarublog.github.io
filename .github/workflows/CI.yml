name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 不用 cancel-in-progress：download-music 会 commit+push 触发新 run，
# 旧 run 继续跑完也不影响（第二次 deploy 覆盖第一次）
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  download-and-commit:
    name: Download Music & Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.22.0"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 在 runner 上临时起一个 meting-api wrapper。runner 的出口 IP 在 US/EU，
      # 不会被 NetEase 按 mainland-China 处理而把某些曲目从 playlist 响应里漏掉。
      # 用完即弃，job 结束自动消失。
      - name: Start local meting-api wrapper
        run: |
          git clone --depth 1 https://git.vedaru.cn/Vedaru/meting-api.git /tmp/meting-api
          cd /tmp/meting-api/src
          # 允许用私有 forgejo（runner 自带的 git 默认不信任自签证书）
          git config --global http.sslVerify false
          npm install --omit=dev --no-audit --no-fund --loglevel=error || \
            npm install --no-audit --no-fund --loglevel=error
          PORT=3300 nohup node wrapper.js > /tmp/meting.log 2>&1 &
          echo $! > /tmp/meting.pid
          # 等 wrapper 就绪（最多 30s）
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3300/healthz > /dev/null; then
              echo "✓ wrapper ready (pid=$(cat /tmp/meting.pid))"
              exit 0
            fi
            sleep 1
          done
          echo "❌ wrapper failed to start within 30s" >&2
          tail -50 /tmp/meting.log >&2
          exit 1
        env:
          METING_KEY: ${{ secrets.METING_KEY }}

      - name: Fetch Bangumi & download music (parallel)
        run: |
          pnpm update-anime &
          PID_BANGUMI=$!
          node scripts/download-music.js &
          PID_MUSIC=$!
          wait $PID_BANGUMI $PID_MUSIC
        env:
          CI: true
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
          METING_KEY: ${{ secrets.METING_KEY }}
          METING_API_BASE: http://127.0.0.1:3300/api

      - name: Commit and push changes
        run: |
          git add -A public/assets/music/ src/data/bangumi-data.json public/assets/anime/cover/ || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # 防循环：如果最新 commit 已经是自动更新，跳过
          LATEST_MSG=$(git log -1 --pretty=%B 2>/dev/null || true)
          if echo "$LATEST_MSG" | grep -qE '^chore: update (music|bangumi)'; then
            echo "Skipping — latest commit is already an automated update"
            exit 0
          fi

          git commit -m "chore: update music & bangumi data (automated)"
          # 并发 run 防护：二进制音乐文件冲突时取远端版本（theirs=origin/main），
          # 若仍有文本冲突则放弃本次更新（下次 run 会自动重试，自愈）。
          git fetch origin main
          if ! git rebase -X theirs origin/main 2>/dev/null; then
            git rebase --abort 2>/dev/null || true
            echo "Skipping auto-update: rebase conflict (next run will retry)"
            exit 0
          fi
          git push origin HEAD:main

  check:
    name: Astro Check
    needs: download-and-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull 拿到 download-and-commit 刚推的代码
      - name: Pull latest main
        run: |
          git remote set-url origin https://github.com/${{ github.repository }}.git
          git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check
        env:
          ENABLE_CONTENT_SYNC: false

  build-and-deploy:
    name: Build and Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull 拿到 download-and-commit 刚推的代码
      - name: Pull latest main
        run: |
          git remote set-url origin https://github.com/${{ github.repository }}.git
          git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm build
        env:
          BASE_PATH: "/vedarublog.github.io/"
          PUBLIC_URL: "https://${{ github.repository_owner }}.github.io/vedarublog.github.io"

      - name: Create .nojekyll
        run: touch dist/.nojekyll

      - name: Create 404 page
        run: |
          if [ -f "dist/index.html" ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
